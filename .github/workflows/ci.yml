name: Build MacFix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-app:
    name: Build macOS app
    runs-on: macos-13
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build MacFix.app
        run: bash MacFixApp/build.sh

  agent:
    name: Validate Agent
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install locked dependencies
        working-directory: agent
        run: uv sync --frozen

      - name: Check Python syntax
        working-directory: agent
        run: uv run python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('macfix_agent').rglob('*.py')]"
